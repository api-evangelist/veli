naftiko: 1.0.0-alpha2
info:
  label: Veli API — Positions
  description: 'Veli API — Positions. 1 operations. Lead operation: Veli Get Positions. Self-contained Naftiko capability
    covering one Veli business surface.'
  tags:
  - Veli
  - Positions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    VELI_API_KEY: VELI_API_KEY
capability:
  consumes:
  - type: http
    namespace: veli-positions
    baseUri: https://api.veli.io/v1
    description: Veli API — Positions business capability. Self-contained, no shared references.
    resources:
    - name: portfolios-portfolioId-positions
      path: /portfolios/{portfolioId}/positions
      operations:
      - name: getpositions
        method: GET
        description: Veli Get Positions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: portfolioId
          in: path
          type: string
          description: Portfolio identifier
          required: true
    authentication:
      type: bearer
      token: '{{env.VELI_API_KEY}}'
  exposes:
  - type: rest
    namespace: veli-positions-rest
    port: 8080
    description: REST adapter for Veli API — Positions. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/portfolios/{portfolioid}/positions
      name: portfolios-portfolioid-positions
      description: REST surface for portfolios-portfolioId-positions.
      operations:
      - method: GET
        name: getpositions
        description: Veli Get Positions
        call: veli-positions.getpositions
        with:
          portfolioId: rest.portfolioId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: veli-positions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Veli API — Positions. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: veli-get-positions
      description: Veli Get Positions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: veli-positions.getpositions
      with:
        portfolioId: tools.portfolioId
      outputParameters:
      - type: object
        mapping: $.
